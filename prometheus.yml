# my global config
global:
  scrape_interval: 5s 

scrape_configs:
  - job_name: "prometheus"

    static_configs:
      - targets: ["localhost:9090"]
        labels:
          app: "prometheus"
      - targets: ["localhost:9256"]
        labels:                   
          app: "process-exporter"
      - targets: ["localhost:9100"]
        labels:                   
          app: "node-exporter"
      - targets: ["localhost:8080"]
        labels:                   
          app: "cadvisor"
    scrape_native_histograms: true
